services:
  - type: web
    name: kairozen-referral-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8266854899"
      - key: REFERRAL_BONUS
        value: "0.20"
      - key: MIN_WITHDRAW
        value: "2.50"
      - key: CHANNEL_USERNAME
        value: "@your_channel_username"
      - key: DATA_DIR
        value: "/opt/render/project/src/data"
